<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Passage d’une phrase à un graphe</title><desc id="desc">Diagramme pédagogique du cours RATISS, sans prétention de preuve physique.</desc><defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#60758a"/></marker>
      <style>
        text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#14213d}
        .title{font-size:25px;font-weight:750}.sub{font-size:15px;fill:#52657a}
        .label{font-size:17px;font-weight:700}.small{font-size:14px;fill:#52657a}
        .tiny{font-size:12px;fill:#52657a}.math{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;font-weight:650}
        .box{fill:#ffffff;stroke:#d4dee8;stroke-width:2}.line{stroke:#60758a;stroke-width:3;fill:none}
        .teal{fill:#e3f5f1;stroke:#2a9d8f;stroke-width:2}.blue{fill:#e8f0ff;stroke:#3971c6;stroke-width:2}
        .orange{fill:#fff0e9;stroke:#e76f51;stroke-width:2}.node{fill:#ffffff;stroke:#1d3557;stroke-width:3}
      </style>
    </defs>
<rect width="1200" height="340" rx="22" fill="#f6f8fb"/>

<text x="42" y="44" class="title">Une phrase devient une petite carte de relations</text>
<text x="42" y="70" class="sub">Exemple-jouet : « A est relié à B » et « B est relié à C ».</text>
<g transform="translate(45,112)">
  <rect x="0" y="0" width="225" height="112" rx="16" class="box"/><text x="20" y="30" class="label">1 · Phrase</text><text x="20" y="62" class="small">A est relié à B</text><text x="20" y="85" class="small">B est relié à C</text>
  <line x1="230" y1="56" x2="267" y2="56" class="line" marker-end="url(#arrow)"/>
  <rect x="280" y="0" width="220" height="112" rx="16" class="blue"/><text x="300" y="30" class="label">2 · Objets / liens</text><text x="300" y="63" class="math">V_D={A,B,C}</text><text x="300" y="88" class="math">E_Dᵃˢˢᵒᶜ={(A,B),(B,C)}</text>
  <line x1="505" y1="56" x2="542" y2="56" class="line" marker-end="url(#arrow)"/>
  <rect x="555" y="0" width="250" height="112" rx="16" class="teal"/><text x="575" y="30" class="label">3 · Graphe G_Dᵣ</text>
  <line x1="620" y1="74" x2="690" y2="74" stroke="#2a9d8f" stroke-width="4"/><line x1="690" y1="74" x2="760" y2="74" stroke="#2a9d8f" stroke-width="4"/>
  <circle cx="620" cy="74" r="14" class="node"/><circle cx="690" cy="74" r="14" class="node"/><circle cx="760" cy="74" r="14" class="node"/>
  <text x="615" y="108" class="small">A</text><text x="685" y="108" class="small">B</text><text x="755" y="108" class="small">C</text>
</g>
<text x="45" y="276" class="small">La carte ne crée pas A—C : seuls les liens déclarés apparaissent.</text>
</svg>