<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Parcours visuel des 50 leçons</title><desc id="desc">Diagramme pédagogique du cours RATISS, sans prétention de preuve physique.</desc><defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#60758a"/></marker>
      <style>
        text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#14213d}
        .title{font-size:25px;font-weight:750}.sub{font-size:15px;fill:#52657a}
        .label{font-size:17px;font-weight:700}.small{font-size:14px;fill:#52657a}
        .tiny{font-size:12px;fill:#52657a}.math{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;font-weight:650}
        .box{fill:#ffffff;stroke:#d4dee8;stroke-width:2}.line{stroke:#60758a;stroke-width:3;fill:none}
        .teal{fill:#e3f5f1;stroke:#2a9d8f;stroke-width:2}.blue{fill:#e8f0ff;stroke:#3971c6;stroke-width:2}
        .orange{fill:#fff0e9;stroke:#e76f51;stroke-width:2}.node{fill:#ffffff;stroke:#1d3557;stroke-width:3}
      </style>
    </defs>
<rect width="1200" height="340" rx="22" fill="#f6f8fb"/>

<text x="42" y="44" class="title">Le parcours : du calcul simple à la formalisation</text>
<text x="42" y="70" class="sub">50 séances courtes — une notion à la fois — avec exemple, exercice et corrigé</text>
<g transform="translate(42,112)">
  <rect x="0" y="0" width="185" height="112" rx="16" class="blue"/><text x="18" y="33" class="label">1 · Calculs</text><text x="18" y="60" class="small">a+b, unités,</text><text x="18" y="82" class="small">courant, mouvement</text><text x="18" y="103" class="tiny">Leçons 1–5</text>
  <line x1="190" y1="56" x2="222" y2="56" class="line" marker-end="url(#arrow)"/>
  <rect x="232" y="0" width="185" height="112" rx="16" class="teal"/><text x="250" y="33" class="label">2 · Objets</text><text x="250" y="60" class="small">ensembles, domaines,</text><text x="250" y="82" class="small">symboles lisibles</text><text x="250" y="103" class="tiny">Leçons 6–10</text>
  <line x1="422" y1="56" x2="454" y2="56" class="line" marker-end="url(#arrow)"/>
  <rect x="464" y="0" width="185" height="112" rx="16" class="orange"/><text x="482" y="33" class="label">3 · Relations</text><text x="482" y="60" class="small">paires, graphes,</text><text x="482" y="82" class="small">ponts et traductions</text><text x="482" y="103" class="tiny">Leçons 11–20</text>
  <line x1="654" y1="56" x2="686" y2="56" class="line" marker-end="url(#arrow)"/>
  <rect x="696" y="0" width="205" height="112" rx="16" class="blue"/><text x="714" y="33" class="label">4 · Topologie</text><text x="714" y="60" class="small">complexes, bords,</text><text x="714" y="82" class="small">cycles, Hₖ, βₖ</text><text x="714" y="103" class="tiny">Leçons 21–35</text>
  <line x1="906" y1="56" x2="938" y2="56" class="line" marker-end="url(#arrow)"/>
  <rect x="948" y="0" width="170" height="112" rx="16" class="teal"/><text x="966" y="33" class="label">5 · Formaliser</text><text x="966" y="60" class="small">échelle, persistance,</text><text x="966" y="82" class="small">source et statut</text><text x="966" y="103" class="tiny">Leçons 36–50</text>
</g>
<text x="42" y="276" class="math" fill="#2a9d8f">Phrase claire → objets → relations → construction → mesure → limite de preuve</text>
</svg>